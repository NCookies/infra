services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    logging: &rotate
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - receiver

  receiver:
    image: ${RECEIVER_IMAGE}
    restart: unless-stopped
    environment:
      API_TOKEN: ${RECEIVER_API_TOKEN}
      API_TOKENS: ${RECEIVER_API_TOKENS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_FAILURES: ${RATE_LIMIT_FAILURES:-15}
      BLOCK_SEC: ${BLOCK_SEC:-3600}
    logging: *rotate
    volumes:
      - ./data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --label-enable --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-7200}
    logging: *rotate

volumes:
  caddy_data:
